version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "DIAG IS_SSR=$IS_SSR SSR_IS_ENABLED=$SSR_IS_ENABLED AWS_FRAMEWORK=$AWS_FRAMEWORK AWS_PLATFORM=$AWS_PLATFORM COMPUTE_SERVICE_IS_ENABLED=$COMPUTE_SERVICE_IS_ENABLED COMPUTE_SERVICE_IS_OPTED_IN=$COMPUTE_SERVICE_IS_OPTED_IN AWS_AMPLIFY_WEB_DYNAMIC_RUNTIME=$AWS_AMPLIFY_WEB_DYNAMIC_RUNTIME PROCESS_FRONTEND_ONLY_APP=$PROCESS_FRONTEND_ONLY_APP REMOTE_BACKEND_EXISTS=$REMOTE_BACKEND_EXISTS"
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

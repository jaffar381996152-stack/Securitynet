version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -E '^(MONGODB_URI|MONGODB_DB|NEXTAUTH_SECRET|NEXTAUTH_URL|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|ADMIN_SECRET|MORALIS_API_KEY|MORALIS_STREAM_SECRET|TRONGRID_API_KEY|DEPOSIT_WALLET_BSC|DEPOSIT_WALLET_ETH|DEPOSIT_WALLET_TRON|OWNER_PRIVATE_KEY|XN_TOKEN_CONTRACT_ADDRESS|NEXT_S3_ACCESS_KEY|NEXT_S3_SECRET_KEY|NEXT_S3_REGION)=' >> .env.production
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify console env vars are only available at BUILD time, not at the
        # Next.js SSR runtime. Copy the ones the app reads at runtime (API routes /
        # server code) into .env.production so they're available in production.
        # Non-prefixed secrets are listed explicitly:
        - env | grep -E '^(MONGODB_URI|MONGODB_DB|NEXTAUTH_SECRET|NEXTAUTH_URL|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|ADMIN_SECRET|MORALIS_API_KEY|MORALIS_STREAM_SECRET|TRONGRID_API_KEY|DEPOSIT_WALLET_BSC|DEPOSIT_WALLET_ETH|DEPOSIT_WALLET_TRON|OWNER_PRIVATE_KEY|XN_TOKEN_CONTRACT_ADDRESS|GROQ_API_KEY|GROQ_MODEL)=' >> .env.production
        # Every app var with a NEXT_ prefix (NEXT_PUBLIC_*, NEXT_S3_*, NEXT_AWS_*):
        - env | grep -E '^NEXT_' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
